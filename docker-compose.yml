services:

  backend:

    build:
      context: .
      dockerfile: backend/Dockerfile

    env_file:
      - .env

    ports:
      - "8000:8000"


  frontend:

    build:
      context: .
      dockerfile: frontend/Dockerfile

    environment:
      BACKEND_URL: http://backend:8000
      LOGO_PATH: assets/logo.png

    depends_on:
      - backend

    ports:
      - "8501:8501"